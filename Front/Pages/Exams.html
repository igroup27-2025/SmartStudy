<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Exams</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="exams">
    <div id="pageRoot">
        <div class="page-hero">
            <div>
                <h2 class="page-hero__title">My Exams</h2>
            </div>
            <button class="btn" id="addExamBtn">+ Add Exam</button>
        </div>

        <div id="examList" class="exam-list">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Exam Modal -->
        <div class="modal-overlay" id="examModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="examModalTitle">Add Exam</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <form id="examForm">
                    <input type="hidden" id="examId">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="examCourseId">Course *</label>
                            <select id="examCourseId" class="form-input" required>
                                <option value="">Select course...</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="examDate">Date *</label>
                                <input type="date" id="examDate" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="examTime">Time *</label>
                                <input type="time" id="examTime" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="examSession">Session *</label>
                                <select id="examSession" class="form-input" required>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="examDuration">Duration (min)</label>
                                <input type="number" id="examDuration" class="form-input" min="0">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Exam</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
