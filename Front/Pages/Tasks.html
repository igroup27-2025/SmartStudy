<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Tasks</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="tasks">
    <div id="pageRoot">
        <div class="page-hero">
            <div>
                <h2 class="page-hero__title">My Tasks</h2>
            </div>
            <div class="page-hero__actions">
                <button class="btn btn-secondary" id="rescheduleBtn">Reschedule All</button>
                <button class="btn" id="addTaskBtn">+ Add Task</button>
            </div>
        </div>

        <div class="filter-bar">
            <select id="filterCourse" class="form-input form-input-sm">
                <option value="">All Courses</option>
            </select>
            <select id="filterStatus" class="form-input form-input-sm">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <select id="filterPriority" class="form-input form-input-sm">
                <option value="">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>

        <!-- Shared Task Invitations -->
        <div id="sharedInvitations" class="shared-invitations" style="display:none;"></div>

        <div id="taskList" class="task-list">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Task Modal -->
        <div class="modal-overlay" id="taskModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="taskModalTitle">Add Task</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="taskTitle">Title *</label>
                            <input type="text" id="taskTitle" class="form-input" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="taskCourseId">Course *</label>
                                <select id="taskCourseId" class="form-input" required>
                                    <option value="">Select course...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="taskType">Type *</label>
                                <select id="taskType" class="form-input" required>
                                    <option value="Homework">Homework</option>
                                    <option value="Assignment">Assignment</option>
                                    <option value="Project">Project</option>
                                    <option value="Lab">Lab</option>
                                    <option value="Reading">Reading</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="taskDueDate">Due Date</label>
                                <input type="date" id="taskDueDate" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="taskHours">Estimated Hours</label>
                                <input type="number" id="taskHours" class="form-input" step="0.5" min="0">
                                <small id="hoursSuggestion" class="form-hint" style="display:none;"></small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority" class="form-input">
                                <option value="">Auto (from due date)</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                            <small class="form-hint">Leave empty to auto-set from due date</small>
                        </div>
                        <!-- Share Task Toggle (only for new tasks) -->
                        <div id="sharedSection" class="form-group">
                            <label class="toggle-label">
                                <input type="checkbox" id="taskShared" class="toggle-input">
                                <span class="toggle-switch"></span>
                                Share with friend
                            </label>
                            <div id="friendSelector" style="display:none;">
                                <select id="taskFriend" class="form-input">
                                    <option value="">Select friend...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Completion Modal -->
        <div class="modal-overlay" id="completeModal">
            <div class="modal modal-sm">
                <div class="modal-header">
                    <h3>Complete Task</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <div class="modal-body">
                    <p id="completeTaskName" style="font-weight:600;margin-bottom:8px;"></p>
                    <p id="completeEstimated" class="text-muted" style="margin-bottom:12px;"></p>
                    <div class="form-group">
                        <label for="actualHours">Actual Hours Spent</label>
                        <input type="number" id="actualHours" class="form-input" step="0.5" min="0" placeholder="How many hours did it take?">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="completeSkip">Skip</button>
                    <button type="button" class="btn btn-primary" id="completeConfirm">Complete</button>
                </div>
            </div>
        </div>

        <!-- Split Task Modal -->
        <div class="modal-overlay" id="splitTaskModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>Split Into Sub-tasks</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <div class="modal-body">
                    <p id="splitParentName" style="font-weight:600;margin-bottom:12px;"></p>
                    <div id="subtaskRows"></div>
                    <button type="button" class="btn btn-ghost btn-sm" id="addSubtaskRow">+ Add Sub-task</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                    <button type="button" class="btn btn-primary" id="splitConfirm">Split Task</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
