<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Ready!</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="onboarding" data-layout="onboarding" data-step="4">
    <div class="onboarding-container">
        <div class="onboarding-logo">S</div>
        <div class="onboarding-dots">
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
        </div>
        <div class="onboarding-progress-bar">
            <div class="onboarding-progress" id="onboardingProgress"></div>
        </div>
        <div class="onboarding-card">
            <h1 class="onboarding-title">You're All Set!</h1>
            <p class="onboarding-subtitle">Here's a summary of your settings. Click "Go to Dashboard" to save and start.</p>

            <div class="onboarding-summary" id="onboardingSummary">
                <div class="onboarding-summary-item" id="summaryStudy"></div>
                <div class="onboarding-summary-item" id="summaryWindow"></div>
                <div class="onboarding-summary-item" id="summarySleep"></div>
                <div class="onboarding-summary-item" id="summaryLunch"></div>
                <div class="onboarding-summary-item" id="summaryNotif"></div>
                <div class="onboarding-summary-item" id="summaryConstraints"></div>
                <div class="onboarding-summary-item" id="summaryExternal"></div>
            </div>
        </div>
        <div class="onboarding-actions">
            <button class="btn btn-ghost" id="onboardingBack">&larr; Back</button>
            <button class="btn btn-primary btn-lg" id="onboardingNext">Go to Dashboard</button>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
