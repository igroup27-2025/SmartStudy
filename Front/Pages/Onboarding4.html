<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Ready!</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="onboarding" data-layout="onboarding" data-step="4">
    <div class="onboarding-container">
        <div class="onboarding-logo">S</div>
        <div class="onboarding-dots">
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
        </div>
        <div class="onboarding-progress-bar">
            <div class="onboarding-progress" id="onboardingProgress"></div>
        </div>
        <div class="onboarding-card">
            <h1 class="onboarding-title">You're All Set!</h1>
            <p class="onboarding-subtitle">Your SmartStudy dashboard is ready. Start managing your academic life smarter.</p>
            <div class="onboarding-illustration">&#127891;</div>
            <div class="onboarding-summary">
                <div class="onboarding-summary-item">&#128200; View your stress score on the Dashboard</div>
                <div class="onboarding-summary-item">&#128197; Check your schedule on the Calendar</div>
                <div class="onboarding-summary-item">&#128202; Analyze trends in Analytics</div>
            </div>
        </div>
        <div class="onboarding-actions">
            <button class="btn btn-primary btn-lg" id="onboardingNext">Go to Dashboard</button>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
