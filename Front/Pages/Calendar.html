<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Calendar</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="calendar">
    <div id="pageRoot">
        <div class="page-hero">
            <div class="calendar-nav">
                <button class="btn btn-sm" id="calPrev">&larr;</button>
                <h2 class="page-hero__title" id="calendarHeader">Loading...</h2>
                <button class="btn btn-sm" id="calNext">&rarr;</button>
            </div>
            <div class="cal-header-actions">
                <button class="btn btn-sm" id="calToday">Today</button>
                <button class="btn btn-sm btn-primary" id="calAddEvent">+ Event</button>
                <button class="btn btn-sm btn-ghost" id="calAddConstraint">+ Constraint</button>
                <button class="btn btn-sm btn-secondary" id="calImportSchedule">Import Schedule</button>
                <button class="btn btn-sm btn-ghost" id="calSyncGoogle" title="Sync Google Calendar">Sync Google</button>
                <input type="file" id="scheduleFileInput" accept=".pdf,.csv,.xlsx,.json" style="display:none">
                <div class="cal-view-toggle">
                    <button class="cal-view-btn active" data-view="weekly">Week</button>
                    <button class="cal-view-btn" data-view="3day">3 Day</button>
                    <button class="cal-view-btn" data-view="monthly">Month</button>
                </div>
            </div>
        </div>

        <div class="calendar-wrapper">
            <div id="calendarGrid" class="calendar-grid">
                <div class="skeleton skeleton-chart" style="height:600px"></div>
            </div>
        </div>

        <div class="calendar-legend">
            <span class="legend-item"><span class="legend-dot" style="background:#00BCD4"></span> Classes</span>
            <span class="legend-item"><span class="legend-dot" style="background:#F28D35"></span> Tasks</span>
            <span class="legend-item"><span class="legend-dot" style="background:#9B76FF"></span> Work</span>
            <span class="legend-item"><span class="legend-dot" style="background:#F2C777"></span> Personal</span>
        </div>

        <!-- Event Creation Modal -->
        <div class="modal-overlay" id="eventModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>Add Event</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <form id="eventForm">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="eventTypeSelect">Event Type</label>
                            <select id="eventTypeSelect" class="form-input">
                                <option value="personal">Personal</option>
                                <option value="class">Class</option>
                                <option value="work">Work</option>
                                <option value="task">Task</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventFromDate">Start Date *</label>
                                <input type="date" id="eventFromDate" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="eventFromTime">Start Time *</label>
                                <input type="time" id="eventFromTime" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventToDate">End Date *</label>
                                <input type="date" id="eventToDate" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="eventToTime">End Time *</label>
                                <input type="time" id="eventToTime" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-checkbox-label">
                                <input type="checkbox" id="eventRecurring"> Recurring weekly
                            </label>
                        </div>

                        <!-- Class-specific fields -->
                        <div id="eventClassFields" class="hidden">
                            <div class="form-group">
                                <label for="eventCourseId">Course</label>
                                <select id="eventCourseId" class="form-input">
                                    <option value="">Select course...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="eventLocation">Location</label>
                                <input type="text" id="eventLocation" class="form-input" placeholder="e.g. Room 101">
                            </div>
                        </div>

                        <!-- Work-specific fields -->
                        <div id="eventWorkFields" class="hidden">
                            <div class="form-group">
                                <label for="eventWorkPlace">Workplace</label>
                                <input type="text" id="eventWorkPlace" class="form-input" placeholder="e.g. Tech Startup Inc.">
                            </div>
                            <div class="form-group">
                                <label for="eventTravelTime">Travel Time (min)</label>
                                <input type="number" id="eventTravelTime" class="form-input" min="0">
                            </div>
                        </div>

                        <!-- Personal-specific fields -->
                        <div id="eventPersonalFields">
                            <div class="form-group">
                                <label for="eventPersonalType">Category</label>
                                <select id="eventPersonalType" class="form-input">
                                    <option value="Exercise">Exercise</option>
                                    <option value="Social">Social</option>
                                    <option value="Errand">Errand</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="eventDescription">Description</label>
                                <input type="text" id="eventDescription" class="form-input" placeholder="What is this event?">
                            </div>
                        </div>

                        <!-- Task-specific fields -->
                        <div id="eventTaskFields" class="hidden">
                            <div class="form-group">
                                <label>Task Source</label>
                                <div class="task-source-toggle">
                                    <button type="button" class="btn btn-sm task-source-btn active" data-source="existing">Existing Task</button>
                                    <button type="button" class="btn btn-sm task-source-btn" data-source="new">New Task</button>
                                </div>
                            </div>

                            <!-- Existing task selector -->
                            <div id="taskExistingFields">
                                <div class="form-group">
                                    <label for="eventTaskId">Select Task</label>
                                    <select id="eventTaskId" class="form-input">
                                        <option value="">Select a task...</option>
                                    </select>
                                </div>
                                <div id="taskInfoCard" class="task-info-card hidden">
                                    <span id="taskInfoHours"></span>
                                    <span id="taskInfoDue"></span>
                                    <span id="taskInfoPriority"></span>
                                </div>
                            </div>

                            <!-- New task inline form -->
                            <div id="taskNewFields" class="hidden">
                                <div class="form-group">
                                    <label for="eventTaskTitle">Task Title *</label>
                                    <input type="text" id="eventTaskTitle" class="form-input" placeholder="e.g. Finish homework ch.5">
                                </div>
                                <div class="form-group">
                                    <label for="eventTaskCourseId">Course *</label>
                                    <select id="eventTaskCourseId" class="form-input">
                                        <option value="">Select course...</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="eventTaskType">Task Type</label>
                                        <select id="eventTaskType" class="form-input">
                                            <option value="Homework">Homework</option>
                                            <option value="Assignment">Assignment</option>
                                            <option value="Project">Project</option>
                                            <option value="Lab">Lab</option>
                                            <option value="Reading">Reading</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="eventTaskPriority">Priority</label>
                                        <select id="eventTaskPriority" class="form-input">
                                            <option value="">None</option>
                                            <option value="High">High</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Low">Low</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="eventTaskDueDate">Due Date</label>
                                        <input type="date" id="eventTaskDueDate" class="form-input">
                                    </div>
                                    <div class="form-group">
                                        <label for="eventTaskHours">Est. Hours</label>
                                        <input type="number" id="eventTaskHours" class="form-input" min="0" step="0.5" placeholder="e.g. 3">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="conflictWarning" class="conflict-warning" style="display:none"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                        <button type="submit" class="btn btn-primary" id="eventSubmitBtn">Create Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
