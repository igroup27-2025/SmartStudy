<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Add Courses</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="onboarding" data-layout="onboarding" data-step="2">
    <div class="onboarding-container">
        <div class="onboarding-logo">S</div>
        <div class="onboarding-dots">
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
        </div>
        <div class="onboarding-progress-bar">
            <div class="onboarding-progress" id="onboardingProgress"></div>
        </div>
        <div class="onboarding-card">
            <h1 class="onboarding-title">Add Your Courses</h1>
            <p class="onboarding-subtitle">Start by adding the courses you're taking this semester. You can always add more later.</p>
            <div class="onboarding-illustration">&#128218;</div>
            <p class="onboarding-hint">Go to Courses page after setup to manage your courses.</p>
        </div>
        <div class="onboarding-actions">
            <button class="btn btn-ghost" id="onboardingBack">&larr; Back</button>
            <button class="btn btn-primary btn-lg" id="onboardingNext">Next</button>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
