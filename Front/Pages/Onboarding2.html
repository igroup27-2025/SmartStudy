<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SmartStudy - Study Preferences</title>
    <link rel="stylesheet" href="../CSS/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="../Scripts/ajaxCall.js"></script>
    <script src="../Scripts/appShell.js"></script>
</head>
<body data-page="onboarding" data-layout="onboarding" data-step="2">
    <div class="onboarding-container">
        <div class="onboarding-logo"><img src="../Images/logo.png" alt="SmartStudy" class="onboarding-logo-img"></div>
        <div class="onboarding-dots">
            <span class="onboarding-dot active"></span>
            <span class="onboarding-dot active current"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
        </div>
        <div class="onboarding-progress-bar">
            <div class="onboarding-progress" id="onboardingProgress" style="width:50%"></div>
        </div>
        <div class="onboarding-card">
            <h1 class="onboarding-title">Study Preferences</h1>
            <p class="onboarding-subtitle">Help us personalize your schedule. You can change these later in Settings.</p>

            <form id="studyPrefsForm" class="onboarding-form">
                <div class="onboarding-field">
                    <label class="onboarding-field__label">Max daily study hours</label>
                    <div class="onboarding-field__range-wrap">
                        <input type="range" id="maxDailyStudy" min="2" max="12" step="0.5" value="6" class="onboarding-range">
                        <span class="onboarding-field__value" id="maxDailyStudyValue">6h</span>
                    </div>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Max continuous study time</label>
                    <select id="maxContinuous" class="form-input">
                        <option value="30">30 minutes</option>
                        <option value="60">60 minutes</option>
                        <option value="90" selected>90 minutes</option>
                        <option value="120">120 minutes</option>
                    </select>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Break between study sessions</label>
                    <select id="breakDuration" class="form-input">
                        <option value="5">5 minutes</option>
                        <option value="10">10 minutes</option>
                        <option value="15" selected>15 minutes</option>
                        <option value="20">20 minutes</option>
                        <option value="30">30 minutes</option>
                    </select>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Preferred study window</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dayStart">Start</label>
                            <select id="dayStart" class="form-input">
                                <option value="5">5:00 AM</option>
                                <option value="6">6:00 AM</option>
                                <option value="7">7:00 AM</option>
                                <option value="8" selected>8:00 AM</option>
                                <option value="9">9:00 AM</option>
                                <option value="10">10:00 AM</option>
                                <option value="11">11:00 AM</option>
                                <option value="12">12:00 PM</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dayEnd">End</label>
                            <select id="dayEnd" class="form-input">
                                <option value="16">4:00 PM</option>
                                <option value="17">5:00 PM</option>
                                <option value="18">6:00 PM</option>
                                <option value="19">7:00 PM</option>
                                <option value="20">8:00 PM</option>
                                <option value="21">9:00 PM</option>
                                <option value="22" selected>10:00 PM</option>
                                <option value="23">11:00 PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Sleep hours per day</label>
                    <div class="onboarding-field__range-wrap">
                        <input type="range" id="sleepHours" min="5" max="10" step="0.5" value="8" class="onboarding-range">
                        <span class="onboarding-field__value" id="sleepHoursValue">8h</span>
                    </div>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Max total active hours per day</label>
                    <div class="onboarding-field__range-wrap">
                        <input type="range" id="maxDailyTotal" min="6" max="20" step="0.5" value="14" class="onboarding-range">
                        <span class="onboarding-field__value" id="maxDailyTotalValue">14h</span>
                    </div>
                    <small class="form-hint" style="color:var(--text-muted);">Study + work + classes + personal (24h minus sleep &amp; routine)</small>
                </div>

                <div class="onboarding-field">
                    <label class="onboarding-field__label">Exam preparation</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="examPrepHoursPerDay">Hours/day</label>
                            <input type="number" id="examPrepHoursPerDay" class="form-input" value="5" min="1" max="12" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="examPrepDays">Days before exam</label>
                            <input type="number" id="examPrepDays" class="form-input" value="3" min="1" max="14" step="1">
                        </div>
                    </div>
                </div>

                <div class="onboarding-field">
                    <div class="onboarding-field__toggle-row">
                        <label class="onboarding-field__label">Lunch break</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="lunchEnabled" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="form-row" id="lunchTimeRow">
                        <div class="form-group">
                            <label for="lunchStart">From</label>
                            <input type="time" id="lunchStart" class="form-input" value="12:00">
                        </div>
                        <div class="form-group">
                            <label for="lunchEnd">Until</label>
                            <input type="time" id="lunchEnd" class="form-input" value="13:00">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="onboarding-actions">
            <button class="btn btn-ghost" id="onboardingBack">&larr; Back</button>
            <button class="btn btn-primary btn-lg" id="onboardingNext">Next</button>
        </div>
    </div>

    <script>
        var STORE_KEY = "smartstudy_onboarding";

        function LoadDraft() {
            try { return JSON.parse(sessionStorage.getItem(STORE_KEY)) || {}; }
            catch (e) { return {}; }
        }
        function SaveDraft(patch) {
            var existing = LoadDraft();
            sessionStorage.setItem(STORE_KEY, JSON.stringify($.extend({}, existing, patch)));
        }

        $(document).ready(function () {
            var data = LoadDraft();

            // Restore saved values
            if (data.maxDailyStudyHours)  $("#maxDailyStudy").val(data.maxDailyStudyHours);
            if (data.sleepHoursPerDay)    $("#sleepHours").val(data.sleepHoursPerDay);
            if (data.maxDailyTotalHours)  $("#maxDailyTotal").val(data.maxDailyTotalHours);
            if (data.maxContinuousMinutes) $("#maxContinuous").val(data.maxContinuousMinutes);
            if (data.breakDurationMinutes) $("#breakDuration").val(data.breakDurationMinutes);
            if (data.dayStartHour)        $("#dayStart").val(data.dayStartHour);
            if (data.dayEndHour)          $("#dayEnd").val(data.dayEndHour);
            if (data.examPrepHoursPerDay) $("#examPrepHoursPerDay").val(data.examPrepHoursPerDay);
            if (data.examPrepDays)        $("#examPrepDays").val(data.examPrepDays);
            if (data.lunchEnabled === false) { $("#lunchEnabled").prop("checked", false); $("#lunchTimeRow").hide(); }
            if (data.lunchStart) $("#lunchStart").val(data.lunchStart);
            if (data.lunchEnd)   $("#lunchEnd").val(data.lunchEnd);

            UpdateRangeLabels();

            $("#maxDailyStudy,#sleepHours,#maxDailyTotal").on("input", UpdateRangeLabels);
            $("#lunchEnabled").on("change", function () {
                $("#lunchTimeRow").toggle(this.checked);
            });

            $("#onboardingBack").on("click", function () {
                CollectStep2();
                window.location.href = BASE_PATH + "/Pages/Onboarding1.html";
            });
            $("#onboardingNext").on("click", function () {
                CollectStep2();
                window.location.href = BASE_PATH + "/Pages/Onboarding3.html";
            });
        });

        function UpdateRangeLabels() {
            $("#maxDailyStudyValue").text($("#maxDailyStudy").val() + "h");
            $("#sleepHoursValue").text($("#sleepHours").val() + "h");
            $("#maxDailyTotalValue").text($("#maxDailyTotal").val() + "h");
        }

        function CollectStep2() {
            SaveDraft({
                maxDailyStudyHours:   parseFloat($("#maxDailyStudy").val()) || 6,
                maxContinuousMinutes: parseInt($("#maxContinuous").val()) || 90,
                dayStartHour:         parseInt($("#dayStart").val()) || 8,
                dayEndHour:           parseInt($("#dayEnd").val()) || 22,
                sleepHoursPerDay:     parseFloat($("#sleepHours").val()) || 8,
                lunchEnabled:         $("#lunchEnabled").is(":checked"),
                lunchStart:           $("#lunchStart").val() || "12:00",
                lunchEnd:             $("#lunchEnd").val() || "13:00",
                breakDurationMinutes: parseInt($("#breakDuration").val()) || 15,
                maxDailyTotalHours:   parseFloat($("#maxDailyTotal").val()) || 14,
                examPrepHoursPerDay:  parseFloat($("#examPrepHoursPerDay").val()) || 5,
                examPrepDays:         parseInt($("#examPrepDays").val()) || 3
            });
        }
    </script>
</body>
</html>
