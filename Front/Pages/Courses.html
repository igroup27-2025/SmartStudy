<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Courses</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="courses">
    <div id="pageRoot">
        <div class="page-hero">
            <div>
                <h2 class="page-hero__title">My Courses</h2>
            </div>
            <button class="btn" id="addCourseBtn">+ Add Course</button>
        </div>

        <div id="courseGrid" class="card-grid-3">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Course Modal -->
        <div class="modal-overlay" id="courseModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="courseModalTitle">Add Course</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <form id="courseForm">
                    <input type="hidden" id="courseId">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="courseName">Course Name *</label>
                            <input type="text" id="courseName" class="form-input" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseCredits">Credits</label>
                                <input type="number" id="courseCredits" class="form-input" step="0.5" min="0">
                            </div>
                            <div class="form-group">
                                <label for="courseWeeklyHours">Weekly Hours</label>
                                <input type="number" id="courseWeeklyHours" class="form-input" step="0.5" min="0">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseSemester">Semester</label>
                                <input type="text" id="courseSemester" class="form-input" placeholder="e.g., 2025B">
                            </div>
                            <div class="form-group">
                                <label for="courseInstructorId">Instructor</label>
                                <select id="courseInstructorId" class="form-input">
                                    <option value="">None</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
