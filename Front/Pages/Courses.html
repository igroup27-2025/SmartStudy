<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SmartStudy - Courses</title>
    <link rel="stylesheet" href="../CSS/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="../Scripts/ajaxCall.js"></script>
    <script src="../Scripts/appShell.js"></script>
</head>
<body data-page="courses">
    <div id="pageRoot">
        <div class="page-actions">
            <button class="btn btn-primary" id="addCourseBtn">+ Add Course</button>
        </div>

        <div id="courseGrid" class="card-grid-3">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Course Modal -->
        <div class="modal-overlay" id="courseModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="courseModalTitle">Add Course</h3>
                    <button type="button" class="modal-close" id="courseModalClose">&times;</button>
                </div>
                <form id="courseForm">
                    <input type="hidden" id="courseId">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="courseName">Course Name *</label>
                            <input type="text" id="courseName" class="form-input" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseCredits">Credits</label>
                                <input type="number" id="courseCredits" class="form-input" step="0.5" min="0">
                            </div>
                            <div class="form-group">
                                <label for="courseWeeklyHours">Weekly Hours</label>
                                <input type="number" id="courseWeeklyHours" class="form-input" step="0.5" min="0">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseSemester">Semester</label>
                                <input type="text" id="courseSemester" class="form-input" placeholder="e.g., 2025B">
                            </div>
                            <div class="form-group">
                                <label for="courseInstructorId">Instructor</label>
                                <select id="courseInstructorId" class="form-input">
                                    <option value="">None</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="courseStudyPartner">Study Partner</label>
                            <select id="courseStudyPartner" class="form-input">
                                <option value="">None</option>
                            </select>
                            <small class="form-hint">Assign a friend as study partner for this course</small>
                        </div>
                        <div class="form-group">
                            <label for="courseDefaultHours">Default estimated hours per task</label>
                            <input type="number" id="courseDefaultHours" class="form-input" step="0.5" min="0.5" max="20" placeholder="Leave empty for global default">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="courseExamPrepHours">Exam prep hours/day</label>
                                <input type="number" id="courseExamPrepHours" class="form-input" step="0.5" min="1" max="12" placeholder="Global default">
                            </div>
                            <div class="form-group">
                                <label for="courseExamPrepDays">Exam prep days</label>
                                <input type="number" id="courseExamPrepDays" class="form-input" step="1" min="1" max="14" placeholder="Global default">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="toggle-label">
                                <input type="checkbox" id="courseSharedByDefault" class="toggle-input">
                                <span class="toggle-switch"></span>
                                Share new tasks by default
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="courseModalCancel">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ---- API endpoints -----------------------------------------------
        var CoursesApi     = API_BASE + "/courses";
        // Handles course api.
        var CourseApi      = function (id) { return API_BASE + "/courses/" + id; };
        var InstructorsApi = API_BASE + "/settings/instructors";
        var ConnectionsApi = API_BASE + "/connections";
        // Handles partner api.
        var PartnerApi     = function (id) { return API_BASE + "/courses/" + id + "/partner"; };

        var COURSE_COLORS = ["#4A90D9", "#F28D35", "#9B76FF", "#43B88C", "#E84B6A", "#54BFB5"];
        var courses = [];
        var instructors = [];
        var friends = [];
        var editingId = null;

        // Escapes a string for safe HTML insertion.
        function escapeHtml(s) {
            if (s == null) return "";
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        $(document).ready(function () {
            if (!requireAuth()) return;
            SmartStudy.initShell("courses");

            $("#addCourseBtn").on("click", OpenAddCourse);
            $("#courseModalClose, #courseModalCancel").on("click", CloseCourseModal);
            $("#courseModal").on("click", function (e) {
                if (e.target.id === "courseModal") CloseCourseModal();
            });
            $("#courseForm").on("submit", SubmitCourse);

            LoadAll();
        });

        // Handles load all.
        function LoadAll() {
            ajaxCall("GET", CoursesApi, null, function (data) {
                courses = data || [];
                ajaxCall("GET", InstructorsApi, null, function (insData) {
                    instructors = insData || [];
                    ajaxCall("GET", ConnectionsApi, null, function (connData) {
                        friends = (connData || []).filter(function (c) { return c.status === "accepted"; }).map(function (c) {
                            var parts = (c.friendName || "").split(" ");
                            return { email: c.friendEmail, firstName: parts[0] || "", lastName: parts.slice(1).join(" ") };
                        });
                        RenderCourses();
                        PopulateInstructors();
                        PopulatePartners();
                    }, function () {
                        friends = [];
                        RenderCourses();
                        PopulateInstructors();
                        PopulatePartners();
                    });
                }, function () {
                    instructors = [];
                    RenderCourses();
                    PopulatePartners();
                });
            }, function () {
                alert("Failed to load courses");
            });
        }

        // Handles populate instructors.
        function PopulateInstructors() {
            var sel = $("#courseInstructorId");
            sel.find("option:not(:first)").remove();
            instructors.forEach(function (i) {
                sel.append('<option value="' + i.instructorId + '">' + escapeHtml(i.instructorName) + '</option>');
            });
        }

        // Handles populate partners.
        function PopulatePartners() {
            var sel = $("#courseStudyPartner");
            sel.find("option:not(:first)").remove();
            friends.forEach(function (f) {
                sel.append('<option value="' + escapeHtml(f.email) + '">' + escapeHtml(f.firstName + ' ' + f.lastName) + '</option>');
            });
        }

        // Handles render courses.
        function RenderCourses() {
            if (!courses.length) {
                $("#courseGrid").html('<div class="empty-state"><div class="empty-state-icon">&#128218;</div><h3>No courses yet</h3><p>Add your first course to get started</p></div>');
                return;
            }
            var html = courses.map(function (c, i) {
                var color = COURSE_COLORS[i % COURSE_COLORS.length];
                return '<div class="course-card" data-id="' + c.courseId + '">' +
                    '<div class="course-card-header" style="background:' + color + '"></div>' +
                    '<div class="course-card-body">' +
                        '<div class="course-card-title-row">' +
                            '<h3 class="course-card-name">' + escapeHtml(c.courseName) + '</h3>' +
                            '<div class="course-card-actions">' +
                                '<button class="btn btn-ghost btn-sm course-edit" data-id="' + c.courseId + '" title="Edit">&#9998;</button>' +
                                '<button class="btn btn-ghost btn-sm course-delete" data-id="' + c.courseId + '" title="Delete">&#128465;</button>' +
                            '</div>' +
                        '</div>' +
                        (c.instructorName ? '<div class="course-instructor">' + escapeHtml(c.instructorName) + '</div>' : '') +
                        '<div class="course-stats">' +
                            '<div class="course-stat"><span class="course-stat-value">' + (c.credits || '-') + '</span><span class="course-stat-label">Credits</span></div>' +
                            '<div class="course-stat"><span class="course-stat-value">' + (c.weeklyHours || '-') + '</span><span class="course-stat-label">Hrs/Week</span></div>' +
                            '<div class="course-stat"><span class="course-stat-value">' + (c.taskCount || 0) + '</span><span class="course-stat-label">Tasks</span></div>' +
                            '<div class="course-stat"><span class="course-stat-value">' + (c.examCount || 0) + '</span><span class="course-stat-label">Exams</span></div>' +
                        '</div>' +
                        (c.semester ? '<div class="course-semester">Semester: ' + escapeHtml(c.semester) + '</div>' : '') +
                        (c.studyPartnerName ? '<div class="course-partner">Study Partner: ' + escapeHtml(c.studyPartnerName) + '</div>' : '') +
                    '</div>' +
                '</div>';
            }).join("");
            $("#courseGrid").html(html);

            $(".course-edit").on("click",   function (e) { e.stopPropagation(); OpenEditCourse(parseInt($(this).data("id"))); });
            $(".course-delete").on("click", function (e) { e.stopPropagation(); DeleteCourse(parseInt($(this).data("id"))); });
        }

        // Handles open add course.
        function OpenAddCourse() {
            editingId = null;
            $("#courseModalTitle").text("Add Course");
            $("#courseForm")[0].reset();
            $("#courseId").val("");
            $("#courseModal").addClass("open");
        }

        // Handles open edit course.
        function OpenEditCourse(id) {
            var c = courses.find(function (x) { return x.courseId === id; });
            if (!c) return;
            editingId = id;
            $("#courseModalTitle").text("Edit Course");
            $("#courseId").val(c.courseId);
            $("#courseName").val(c.courseName || "");
            $("#courseCredits").val(c.credits || "");
            $("#courseWeeklyHours").val(c.weeklyHours || "");
            $("#courseSemester").val(c.semester || "");
            $("#courseInstructorId").val(c.instructorId || "");
            $("#courseStudyPartner").val(c.studyPartnerEmail || "");
            $("#courseSharedByDefault").prop("checked", !!c.sharedByDefault);
            $("#courseDefaultHours").val(c.defaultTaskEstimatedHours || "");
            $("#courseExamPrepHours").val(c.examPrepHoursPerDay || "");
            $("#courseExamPrepDays").val(c.examPrepDays || "");
            $("#courseModal").addClass("open");
        }

        // Handles close course modal.
        function CloseCourseModal() { $("#courseModal").removeClass("open"); }

        // Submits the course.
        function SubmitCourse(e) {
            e.preventDefault();
            var data = {
                courseName:   $("#courseName").val(),
                weeklyHours:  parseFloat($("#courseWeeklyHours").val()) || null,
                credits:      parseFloat($("#courseCredits").val()) || null,
                semester:     $("#courseSemester").val() || null,
                instructorId: parseInt($("#courseInstructorId").val()) || null,
                sharedByDefault: $("#courseSharedByDefault").is(":checked"),
                defaultTaskEstimatedHours: parseFloat($("#courseDefaultHours").val()) || null,
                examPrepHoursPerDay: parseFloat($("#courseExamPrepHours").val()) || null,
                examPrepDays: parseInt($("#courseExamPrepDays").val()) || null
            };
            var partnerEmail = $("#courseStudyPartner").val() || null;

            if (editingId) {
                ajaxCall("PUT", CourseApi(editingId), JSON.stringify(data),
                    function () { SetPartnerThenReload(editingId, partnerEmail); },
                    CourseSaveEC);
            } else {
                ajaxCall("POST", CoursesApi, JSON.stringify(data),
                    function (created) {
                        var newId = created && created.courseId;
                        SetPartnerThenReload(newId, partnerEmail);
                    },
                    CourseSaveEC);
            }
        }

        // Handles set partner then reload.
        function SetPartnerThenReload(courseId, email) {
            if (courseId && email !== null && email !== undefined) {
                ajaxCall("PUT", PartnerApi(courseId), JSON.stringify({ email: email }),
                    function () { CloseCourseModal(); LoadAll(); },
                    function () { CloseCourseModal(); LoadAll(); });
            } else {
                CloseCourseModal();
                LoadAll();
            }
        }

        // Error callback for Course Save.
        function CourseSaveEC(xhr) {
            alert((xhr.responseJSON && xhr.responseJSON.message) || "Failed to save course");
        }

        // Handles delete course.
        function DeleteCourse(id) {
            if (!confirm("Delete this course? All tasks and exams will also be deleted.")) return;
            ajaxCall("DELETE", CourseApi(id), null,
                function () { LoadAll(); },
                function () { alert("Failed to delete course"); });
        }
    </script>
</body>
</html>
