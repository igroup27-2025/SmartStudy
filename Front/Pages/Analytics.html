<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Analytics</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="analytics">
    <div id="pageRoot">
        <div class="page-hero">
            <div>
                <h2 class="page-hero__title">Analytics</h2>
            </div>
        </div>

        <div class="analytics-grid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Stress Score</h3>
                </div>
                <div class="card-body" id="stressOverview">
                    <div class="skeleton skeleton-chart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Weekly Stress Trend</h3>
                </div>
                <div class="card-body" id="weeklyChart">
                    <div class="skeleton skeleton-chart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Workload by Course</h3>
                </div>
                <div class="card-body" id="workloadByCourse">
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Task Statistics</h3>
                </div>
                <div class="card-body" id="taskStats">
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Estimated vs Actual Hours</h3>
                </div>
                <div class="card-body" id="estimatedVsActual">
                    <div class="skeleton skeleton-chart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Learning Insights</h3>
                </div>
                <div class="card-body" id="learningInsights">
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
