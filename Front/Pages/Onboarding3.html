<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Add Tasks</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="onboarding" data-layout="onboarding" data-step="3">
    <div class="onboarding-container">
        <div class="onboarding-logo">S</div>
        <div class="onboarding-dots">
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
            <span class="onboarding-dot"></span>
        </div>
        <div class="onboarding-progress-bar">
            <div class="onboarding-progress" id="onboardingProgress"></div>
        </div>
        <div class="onboarding-card">
            <h1 class="onboarding-title">Track Your Tasks</h1>
            <p class="onboarding-subtitle">Add homework, assignments, and projects. SmartStudy will calculate your workload and help you stay on track.</p>
            <div class="onboarding-illustration">&#9745;</div>
            <p class="onboarding-hint">Set priorities and due dates to get the most out of stress tracking.</p>
        </div>
        <div class="onboarding-actions">
            <button class="btn btn-ghost" id="onboardingBack">&larr; Back</button>
            <button class="btn btn-primary btn-lg" id="onboardingNext">Next</button>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
