<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy - Friends</title>
    <link rel="stylesheet" href="/CSS/app.css">
</head>
<body data-page="friends">
    <div id="pageRoot">
        <div class="page-hero">
            <div>
                <h2 class="page-hero__title">Friends</h2>
                <p class="text-sm" style="color: var(--text-inverse); opacity: 0.9; margin-top: var(--space-1);">Connect and study together</p>
            </div>
            <button class="btn" id="inviteFriendBtn">+ Invite Friend</button>
        </div>

        <!-- Pending Requests Section -->
        <section id="friendRequests" class="friends-section" style="display: none;">
            <div class="friends-section-header">
                <h3>Pending Requests</h3>
                <span class="friends-section-badge" id="requestCount">0</span>
            </div>
            <div id="requestsList"></div>
        </section>

        <!-- Friends Grid -->
        <div id="friendsList" class="card-grid-3">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Invite Modal -->
        <div class="modal-overlay" id="inviteModal">
            <div class="modal" style="max-width: 440px;">
                <div class="modal-header">
                    <h3>Invite a Friend</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <form id="inviteForm">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="inviteEmail">Friend's Email *</label>
                            <input type="email" id="inviteEmail" class="form-input" placeholder="friend@university.edu" required>
                            <p class="form-hint">They'll receive a connection request they can accept or decline.</p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                        <button type="submit" class="btn btn-primary">Send Invite</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Safe Zone Modal -->
        <div class="modal-overlay" id="safeZoneModal">
            <div class="modal" style="max-width: 560px;">
                <div class="modal-header">
                    <h3 id="safeZoneTitle">Safe Study Zones</h3>
                    <button class="modal-close" data-close-modal>&times;</button>
                </div>
                <div class="modal-body" id="safeZoneContent">
                    <div class="spinner-center"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/Script/main.js"></script>
</body>
</html>
